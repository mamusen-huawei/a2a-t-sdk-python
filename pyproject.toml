[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[project]
name = "a2a-t-sdk"
version = "1.0.0"
description = "Python A2A SDK for Telecom Scenarios"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "A2A SDK Team" },
]
keywords = ["a2a", "agent", "telecom", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "jsonschema>=4.23.0",
    "python-dotenv>=1.1.0",
    "openai",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-jsonschema>=4.23.0",
    "hypothesis>=6.167.1",
    "mkdocs>=1.6.1",
    "mkdocstrings-python>=2.0.8",
    "mkdocs-material>=9.7.7",
]

[project.urls]
Homepage = "https://github.com/project-openan/a2a-t-sdk-python"
Documentation = "https://github.com/project-openan/a2a-t-sdk-python#readme"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.build-backend]
module-name = "a2a_t"
source-exclude = [".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
markers = [
    # Live-LLM corpus family (D24): opt-in through the A2AT_TEST_LLM_* environment variables;
    # absent variables skip the family. CI excludes it with -m 'not live'.
    "live: live-LLM corpus tests against a real A2AT_TEST_LLM_* endpoint (skips when unconfigured)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "E501"]
# The corpus loader's raw-record dataclasses mirror the camelCase corpus JSON keys verbatim
# (D21 strict binding: the field name IS the corpus key), and CorpusLoadException keeps the
# Java exception name for cross-repo parity.
"tests/corpus/loader.py" = ["N815", "N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
